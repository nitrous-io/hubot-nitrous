# hubot
description "Nitrous hubot"
author "Nitrous.IO Engineering <eng@nitrous.io>"

start on filesystem or runlevel [2345]
stop on runlevel [!2345]


env HUBOT_DIR='/home/nitrous/code/hubot-nitrous/'
env HUBOT='bin/hubot'
env HUBOT_USER='nitrous'

# Keep the process alive, limit to 5 restarts in 60s
respawn
respawn limit 5 60

console log

exec start-stop-daemon --start --chuid ${HUBOT_USER} --chdir ${HUBOT_DIR} --exec  ${HUBOT_DIR}${HUBOT}